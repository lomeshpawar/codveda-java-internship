<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="354" viewBox="0 0 1100 354"><rect width="1100" height="354" rx="14" fill="#111827"/><circle cx="28" cy="28" r="7" fill="#ef4444"/><circle cx="52" cy="28" r="7" fill="#f59e0b"/><circle cx="76" cy="28" r="7" fill="#22c55e"/><text x="100" y="34" fill="#e5e7eb" font-family="sans-serif" font-size="18">Multithreaded Chat — Successful Run</text><g fill="#f9fafb" font-family="monospace" font-size="18"><text x="28" y="95">$ java ChatServer</text><text x="28" y="121">Chat server starting on port 5000...</text><text x="28" y="147">$ java ChatClient (Alice)</text><text x="28" y="173">Welcome, Alice! Type messages below.</text><text x="28" y="199">$ java ChatClient (Bob)</text><text x="28" y="225">Welcome, Bob! Type messages below.</text><text x="28" y="251">Alice: Hello Bob</text><text x="28" y="277">Alice left the chat.</text><text x="28" y="303">Disconnected from server.</text></g></svg>