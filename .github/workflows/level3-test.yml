name: Level 3 Java Tests

on:
  push:
    paths-ignore:
      - 'Level-3/*/screenshots/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  level3:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: library_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download MySQL Connector/J
        run: |
          mkdir -p Level-3/Library-Management-JDBC/lib
          curl -L -o Level-3/Library-Management-JDBC/lib/mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.4.0/mysql-connector-j-9.4.0.jar

      - name: Compile Level 3 projects
        run: |
          mkdir -p Level-3/Library-Management-JDBC/out
          mkdir -p Level-3/Multithreaded-Chat/out
          javac -cp 'Level-3/Library-Management-JDBC/lib/mysql-connector-j.jar' \
            -d Level-3/Library-Management-JDBC/out Level-3/Library-Management-JDBC/src/*.java
          javac -d Level-3/Multithreaded-Chat/out Level-3/Multithreaded-Chat/src/*.java

      - name: Test Library Management JDBC
        env:
          LIBRARY_DB_URL: jdbc:mysql://127.0.0.1:3306/library_db
          LIBRARY_DB_USER: root
          LIBRARY_DB_PASSWORD: root
        run: |
          mkdir -p Level-3/Library-Management-JDBC/test-output
          printf '1\nJava Programming\nJames Gosling\n2\n3\nLomesh Pawar\nlomesh@example.com\n4\n1\n1\n6\n5\n1\n6\n7\n' |
            java -cp 'Level-3/Library-Management-JDBC/out:Level-3/Library-Management-JDBC/lib/mysql-connector-j.jar' LibraryManagementJDBC \
            | tee Level-3/Library-Management-JDBC/test-output/execution.txt
          grep -q 'Database ready.' Level-3/Library-Management-JDBC/test-output/execution.txt
          grep -q 'Book added.' Level-3/Library-Management-JDBC/test-output/execution.txt
          grep -q 'Member added.' Level-3/Library-Management-JDBC/test-output/execution.txt
          grep -q 'Book issued.' Level-3/Library-Management-JDBC/test-output/execution.txt
          grep -q 'Book returned.' Level-3/Library-Management-JDBC/test-output/execution.txt
          grep -q 'Goodbye!' Level-3/Library-Management-JDBC/test-output/execution.txt

      - name: Test Multithreaded Chat
        run: |
          mkdir -p Level-3/Multithreaded-Chat/test-output
          java -cp Level-3/Multithreaded-Chat/out ChatServer > Level-3/Multithreaded-Chat/test-output/server.txt 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          python3 - <<'PY'
          import socket, time
          def connect(name):
              s=socket.create_connection(('127.0.0.1',5000),timeout=5)
              s.settimeout(2)
              s.recv(1024)
              s.sendall((name+'\n').encode())
              return s
          a=connect('Lomesh')
          time.sleep(.3)
          b=connect('Friend')
          time.sleep(.5)
          a.sendall(b'Hello Friend!\n')
          b.sendall(b'Hello Lomesh!\n')
          time.sleep(.5)
          data_a=a.recv(4096).decode(errors='replace')
          data_b=b.recv(4096).decode(errors='replace')
          open('Level-3/Multithreaded-Chat/test-output/client1.txt','w').write(data_a)
          open('Level-3/Multithreaded-Chat/test-output/client2.txt','w').write(data_b)
          a.sendall(b'/quit\n')
          b.sendall(b'/quit\n')
          a.close(); b.close()
          PY
          grep -q 'Hello Friend!' Level-3/Multithreaded-Chat/test-output/client2.txt
          grep -q 'Hello Lomesh!' Level-3/Multithreaded-Chat/test-output/client1.txt

      - name: Create execution screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          def svg(out, title, lines):
              lines=[x.rstrip() for x in lines.splitlines() if x.strip()]
              shown=lines[-28:]
              body=''.join(f'<text x="24" y="{48+i*22}">{html.escape(x)}</text>' for i,x in enumerate(shown))
              height=70+len(shown)*22
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="{height}" viewBox="0 0 1200 {height}">
          <rect width="1200" height="{height}" fill="#111827" rx="12"/>
          <circle cx="24" cy="22" r="6" fill="#ef4444"/><circle cx="44" cy="22" r="6" fill="#f59e0b"/><circle cx="64" cy="22" r="6" fill="#22c55e"/>
          <text x="90" y="27" fill="#d1d5db" font-family="monospace" font-size="14">{html.escape(title)}</text>
          <g fill="#e5e7eb" font-family="monospace" font-size="16">{body}</g></svg>'''
          jdbc=Path('Level-3/Library-Management-JDBC/test-output/execution.txt').read_text()
          Path('Level-3/Library-Management-JDBC/screenshots/execution-success.svg').write_text(svg('execution-success.svg','Library Management JDBC — automated execution',jdbc))
          c1=Path('Level-3/Multithreaded-Chat/test-output/client1.txt').read_text()
          c2=Path('Level-3/Multithreaded-Chat/test-output/client2.txt').read_text()
          server=Path('Level-3/Multithreaded-Chat/test-output/server.txt').read_text()
          combined='Client 1 (Lomesh):\n'+c1+'\nClient 2 (Friend):\n'+c2+'\nServer:\n'+server
          Path('Level-3/Multithreaded-Chat/screenshots/multiclient-execution-success.svg').write_text(svg('multiclient-execution-success.svg','Multithreaded Chat — automated execution',combined))
          PY

      - name: Commit verified screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Level-3/*/screenshots/*.svg
          git diff --cached --quiet && exit 0
          git commit -m 'test: add automated Level 3 execution screenshots'
          git push
