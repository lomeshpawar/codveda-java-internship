name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: library_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Level 1 projects
        run: |
          mkdir -p build/level1-calculator build/level1-guessing
          javac -d build/level1-calculator Level-1/Basic-Calculator/src/*.java
          javac -d build/level1-guessing Level-1/Number-Guessing-Game/src/*.java

      - name: Test Basic Calculator
        run: |
          output=$(printf '10\n+\n5\n' | java -cp build/level1-calculator BasicCalculator)
          printf '%s\n' "$output"
          grep -q 'Result = 15.0' <<< "$output"

          output=$(printf '10\n/\n0\n' | java -cp build/level1-calculator BasicCalculator)
          grep -q 'Cannot divide by zero' <<< "$output"

      - name: Test Number Guessing Game startup validation
        run: |
          set +e
          output=$(timeout 2s bash -c "printf 'abc\\n' | java -cp build/level1-guessing NumberGuessingGame" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 124
          grep -q 'Please enter a valid integer' <<< "$output"

      - name: Compile Level 2 projects
        run: |
          mkdir -p build/level2-banking build/level2-employees
          javac -d build/level2-banking Level-2/Banking-Application/src/*.java
          javac -d build/level2-employees Level-2/Employee-Management-System/src/*.java

      - name: Test Banking Application
        run: |
          output=$(printf '1\nACC001\nLomesh Pawar\n1000\n2\nACC001\n250\n3\nACC001\n100\n4\nACC001\n5\nACC001\n6\n' | java -cp build/level2-banking BankingApplication)
          printf '%s\n' "$output"
          grep -q 'Account created successfully.' <<< "$output"
          grep -q 'Deposit successful.' <<< "$output"
          grep -q 'Withdrawal successful.' <<< "$output"
          grep -q 'Current balance: 1150.00' <<< "$output"
          grep -q 'Thank you!' <<< "$output"

      - name: Test Employee Management System
        run: |
          output=$(printf '1\n101\nLomesh Pawar\nEngineering\n50000\n2\n3\n101\n4\n101\nLomesh Pawar Updated\nTechnology\n55000\n5\n101\n6\n' | java -cp build/level2-employees EmployeeManagementSystem)
          printf '%s\n' "$output"
          grep -q 'Employee added.' <<< "$output"
          grep -q 'ID: 101' <<< "$output"
          grep -q 'Employee updated.' <<< "$output"
          grep -q 'Employee deleted.' <<< "$output"
          grep -q 'Goodbye!' <<< "$output"

      - name: Download MySQL Connector/J
        run: |
          mkdir -p build/jdbc-lib
          curl -fsSL -o build/jdbc-lib/mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.4.0/mysql-connector-j-9.4.0.jar

      - name: Compile Level 3 projects
        run: |
          mkdir -p build/level3-jdbc build/level3-chat
          javac -cp build/jdbc-lib/mysql-connector-j.jar -d build/level3-jdbc Level-3/Library-Management-JDBC/src/*.java
          javac -d build/level3-chat Level-3/Multithreaded-Chat/src/*.java

      - name: Test Library Management JDBC
        env:
          LIBRARY_DB_URL: jdbc:mysql://127.0.0.1:3306/library_db
          LIBRARY_DB_USER: root
          LIBRARY_DB_PASSWORD: root
        run: |
          output=$(printf '1\nJava Programming\nJames Gosling\n3\nLomesh Pawar\nlomesh@example.com\n4\n1\n1\n6\n5\n1\n6\n2\n7\n' | java -cp 'build/level3-jdbc:build/jdbc-lib/mysql-connector-j.jar' LibraryManagementJDBC)
          printf '%s\n' "$output"
          grep -q 'Database ready.' <<< "$output"
          grep -q 'Book added successfully.' <<< "$output"
          grep -q 'Member added successfully.' <<< "$output"
          grep -q 'Book issued successfully.' <<< "$output"
          grep -q 'Book returned successfully.' <<< "$output"
          grep -q 'Returned:' <<< "$output"
          grep -q 'Available' <<< "$output"
          grep -q 'Goodbye!' <<< "$output"

      - name: Test Multithreaded Chat
        run: |
          java -cp build/level3-chat ChatServer > /tmp/chat-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2

          python3 - <<'PY'
          import socket
          import time

          def connect(name):
              sock = socket.create_connection(('127.0.0.1', 5000), timeout=5)
              sock.settimeout(2)
              sock.recv(1024)
              sock.sendall((name + '\n').encode())
              return sock

          alice = connect('Lomesh')
          time.sleep(0.3)
          bob = connect('Friend')
          time.sleep(0.5)

          alice.sendall(b'Hello Friend!\n')
          bob.sendall(b'Hello Lomesh!\n')
          time.sleep(0.5)

          data_alice = alice.recv(4096).decode(errors='replace')
          data_bob = bob.recv(4096).decode(errors='replace')

          assert 'Hello Lomesh!' in data_alice
          assert 'Hello Friend!' in data_bob

          alice.sendall(b'/quit\n')
          bob.sendall(b'/quit\n')
          alice.close()
          bob.close()
          print('Multithreaded chat test passed.')
          PY

      - name: Verify project documentation
        run: |
          test -f README.md
          test -f Level-1/Basic-Calculator/README.md
          test -f Level-1/Number-Guessing-Game/README.md
          test -f Level-2/Banking-Application/README.md
          test -f Level-2/Employee-Management-System/README.md
          test -f Level-3/Library-Management-JDBC/README.md
          test -f Level-3/Multithreaded-Chat/README.md
